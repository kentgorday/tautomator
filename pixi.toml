[workspace]
channels = ["conda-forge"]
name = "tautomator"
platforms = ["linux-64", "osx-arm64"]
version = "0.1.0"
# psi4-swig-pcm (the psi4 feature) is a conda package built from its git source,
# which pixi still treats as a preview feature (0.82).
preview = ["pixi-build"]
# psi4-swig-pcm builds with pixi-build-python >= 0.8, whose build API pixi
# accepts from 0.71.
requires-pixi = ">=0.71.0"

[tasks]
lint = "ruff check tautomator/ tests/ scripts/"
format = "ruff format tautomator/ tests/ scripts/"
format-check = "ruff format --check tautomator/ tests/ scripts/"
typecheck = "mypy tautomator/ tests/ scripts/"
check = { depends-on = ["lint", "format-check", "typecheck"] }

[dependencies]
# Without a pin, a fresh solve (a full relock, or any new environment) settles on
# Python 3.11 on linux-64, which the package's requires-python >=3.13 rejects.
python = "3.13.*"
# Pin CREST 2.12 (not 3.x). The CREST 3.x rewrite moved optimization/MD/MTD
# in-process; on macOS its conformer search collapses every ensemble to a single
# structure (verified: n-pentane gives 1 conformer on 3.0.2 vs 6 on 2.12, on both
# osx-arm64 and osx-64-under-Rosetta; cf. crest-lab/crest#407,#411,#412). 2.12
# drives the external xtb binary and works. single_point() and frequencies() call
# xtb directly (CREST 2.x has no --sp run mode).
crest = "2.12.*"
# Floor xtb at 6.7.1. Pressure on mctc-lib has made the solver fall back to xtb
# 6.4.1 (the last release with no mctc-lib dependency) before: that was
# gcp-correction 2.3.2 build 2, which now lives in the psi4 environment. xtb 6.7.1
# build >=4 also fixes the build-2 Fortran format-string bug (grimme-lab/xtb#1332).
xtb = ">=6.7.1"
rdkit = ">=2024.03,<2026"
pytest = ">=9.0.3,<10"
mypy = ">=1.20.0,<2"
# PySCF, the DFT backend that runs in this environment (as a Python library):
# wB97X-3c/vDZP (default refinement) or wB97M-V + SMD (scoring).  The other
# backend, Psi4, has an environment of its own: see the psi4 feature below.
# PySCF 2.13.1 rewrote its dispersion dispatch (PR #3209); pyscf_runner detects
# which dispatch it has and sets the D4 composites up accordingly.  Verified on
# 2.11.0, 2.13.1 and 2.14.0 (2.7.0-2.13.0 share 2.11's dispersion code).  The
# upper bound is the last verified release: v2.16 has announced further
# dispersion changes, so re-run the pyscf tests on it before raising it.
pyscf = ">=2.7,<2.15"
# Dispersion for PySCF.  pyscf-dispersion bundles its own libdftd4/libs-dftd3,
# whose parameter names differ by release (see pyscf_runner._D4_PARAMS); >=1.3
# because 1.2 bundles dftd4 3.6.0, which does not know "wb97x-3c" or
# "wb97x-rev".  dftd4-python is not used by PySCF: it is the independent build
# the tests check those parameters against (in a subprocess, because the two
# libdftd4 cannot share a process).
pyscf-dispersion = ">=1.3"
dftd4-python = ">=4.0"
# Basis set exchange: provides vDZP basis set for wB97X-3c (not in PySCF's
# built-in basis library).
basis_set_exchange = ">=0.12,<0.13"
# geomeTRIC: geometry optimizer used by PySCF and OrbMol for the refinement stage.
geometric = ">=1.0"
# OrbMol-v2 (orb-models, PyPI only): machine-learned refinement driver.  torch,
# dm-tree and ase come from conda-forge.  orb-models pins dm-tree==0.1.8, which
# has no PyPI wheel for CPython 3.13 and whose conda-forge builds need libabseil
# 2024 (conflicts with current pytorch); it only uses tree.map_structure/flatten,
# unchanged since, so the pin is overridden below.  conda-forge pytorch >=2.10 is
# built against pybind11-abi 11 while PySCF's xcfun needs abi 4, so the solver
# holds torch at 2.8/2.9.  On linux-64 it picks the cpu_mkl build, which
# switches libblas to MKL.
pytorch = ">=2.8"
dm-tree = ">=0.1.8"
ase = ">=3.25,<4"
# Held back for orb-models' cached-path (PyPI), which cannot override a conda
# package: it requires filelock <4, which torch brings, and its botocore requires
# python-dateutil <3.  A fresh solve takes 4.x and 3.x from conda-forge.
filelock = "<4"
python-dateutil = "<3"
# numba compiles the nonelectrostatic correction's pair loops (the dispersion
# kernel over cavity points x surface elements, and its derivatives); written
# with numpy temporaries, the kernel alone cost more than a vDZP SCF.
numba = ">=0.68"

# BLAS/LAPACK is conda-forge's default: OpenBLAS on osx-arm64, MKL on linux-64
# (through pytorch, above).  Not Apple's Accelerate: its dpotrf on the upper triangle,
# which scipy's cholesky(lower=True) calls, reads and writes outside its matrix for
# orders of about 1450-5500 (macOS 27.0.1, in both of its LAPACK interfaces), and the
# heap it corrupts crashes Python later; through the newer interface it also returns
# wrong factors.  psi4-swig-pcm's cavity check and PySCF's density fitting call it
# (README, "Non-obvious design decisions").  Apple has fixed it in macOS 27.2
# (scipy/scipy#26145, confirmed in 27.2 beta 3), so Accelerate can come back once
# 27.2 is released, with a 27.2 floor on the platform; the README lists what to
# check first.

[pypi-dependencies]
tautomator = { path = ".", editable = true }
ruff = ">=0.11,<1"
orb-models = ">=0.7.0,<0.8"

[pypi-options.dependency-overrides]
dm-tree = ">=0.1.8"

# Psi4 has an environment to itself.  tautomator never imports it: psi4_runner
# writes an input deck, launches the `psi4` executable from this environment
# and reads the output back, so nothing here has to agree with the versions in
# the default environment.  They could not agree: Psi4 after 1.10.0 is built
# against pybind11-abi 11 and PySCF's xcfun against abi 4, which held Psi4 at
# 1.10.0 (and libxc at 7.0) for as long as the two shared an environment.  The
# floor is 1.11 because 1.10 still solves against libxc 7.1 and then fails on
# import (7.1 removed functionals that 1.10 builds into its table).
[feature.psi4.dependencies]
python = "3.13.*"
# psi4-swig-pcm is compiled against Psi4's C++ classes and run-exports the Psi4
# it was built with, which holds this to 1.11.x.
psi4 = ">=1.11,<2"
# Implicit solvent: psi4_runner's input decks import it.  The same
# switching/Gaussian PCM as PySCF's, and a host for MOIST's DROP cavities, with
# analytical gradients and the nonelectrostatic correction (LGPL-3.0, like Psi4,
# hence a repository of its own).  Built from source by pixi-build, at the commit
# `rev` names (its nonelectrostatic-drop branch, until that is on its main).
psi4-swig-pcm = { git = "https://github.com/kentgorday/psi4-swig-pcm.git", rev = "11b8abc0c98060fbbcb7d3288ee0105bdc4d3470" }
# Psi4's optimizer (optking) converts units through qcelemental's pint registry, which
# qcelemental 0.51.2 and 0.51.3 cannot build under pint 0.26.2 (pint rejects their
# "J^{-2}"): with either, psi4.optimize fails.  0.51.4 works with pint 0.26.1 and 0.26.2.
# psi4-swig-pcm pins it for its own environments only, so the pin is needed here too.
qcelemental = ">=0.51.4"
# What Psi4 calls for -D3, -D4 and the gCP term of the 3c composites.
dftd3-python = ">=1.0"
dftd4-python = ">=4.0"
gcp-correction = ">=2.3.2,<3"

# MOIST: its SvdW-DROP and isodensity (rho-DROP) cavities for the PCM models, as
# solvent_model "<model>/<cavity>" (IEFPCM/SvdW-DROP is the default): PySCF's through
# tautomator.pyscf_moist, Psi4's through psi4-swig-pcm's MOIST host; the nonelectrostatic
# correction's gradients on them need the surface contractions the recipe's patch 0002
# exports.  Built from source by pixi-build, from the recipe in psi4-swig-pcm's repository
# (packages/moist: pinned to a MOIST release), which psi4-swig-pcm builds its own moist
# environment from too: one recipe for both.  Only the recipe comes from there; no Psi4 comes
# with it.  `rev` pins the commit (psi4-swig-pcm's nonelectrostatic-drop branch, until that is
# on its main), the same as psi4-swig-pcm's above.  The first install compiles MOIST (about 9
# minutes on 4 cores, once: both environments get the same build).
[feature.moist.dependencies]
moist = { git = "https://github.com/kentgorday/psi4-swig-pcm.git", rev = "11b8abc0c98060fbbcb7d3288ee0105bdc4d3470", subdirectory = "packages/moist" }

[environments]
# Both with MOIST, as the default solvent model needs it.  Every Psi4 job of a run, DROP
# solvent models included, runs the psi4 environment's one Psi4.
default = { features = ["moist"], solve-group = "default" }
psi4 = { features = ["psi4", "moist"], no-default-feature = true }
