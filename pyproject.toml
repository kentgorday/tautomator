[project]
name = "tautomator"
version = "0.1.0"
requires-python = ">=3.13"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.mypy]
strict = true
warn_return_any = true
warn_unused_configs = true

[[tool.mypy.overrides]]
module = [
    "rdkit.*",
    "pyscf.*",
    "pyscf",
    "scipy.*",
    "basis_set_exchange",
    "dftd4.*",
    "orb_models.*",
    "cached_path",
    "geometric",
    "geometric.*",
    "moist",
    "moist.*",
]
ignore_missing_imports = true

# conda-forge ships RDKit stubs on linux-64 but not osx-arm64 (cross-compiled
# there), and the stubs are wrong in places (untyped functions, missing
# re-exports such as AllChem.EmbedMolecule).  Skip them so RDKit is untyped on
# every platform.
[[tool.mypy.overrides]]
module = ["rdkit", "rdkit.*"]
follow_imports = "skip"
follow_imports_for_stubs = true

[tool.ruff]
target-version = "py313"
line-length = 99

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM", "RUF"]

[tool.pytest.ini_options]
markers = ["slow: marks tests that call external programs (xtb, crest) or load the OrbMol model"]
